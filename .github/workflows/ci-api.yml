name: ci-api

# The server's checks: lint, format, types, database changes, tests. PostgreSQL, Redis and MinIO come from
# apps/api/compose.yaml, the same containers a developer runs, with the dev-only values from .env.example.

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/ci-api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/ci-api.yml"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations

      - name: Start PostgreSQL, Redis and MinIO
        run: |
          cp .env.example .env
          docker compose up -d --wait db redis minio
          timeout 60 sh -c 'until curl -sf http://localhost:9100/minio/health/live; do sleep 1; done'
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
