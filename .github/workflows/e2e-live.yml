name: e2e-live

# The website in live mode against the real server (apps/api), end to end in a browser. PostgreSQL, Redis and
# MinIO come from apps/api/compose.yaml with the dev-only values of .env.example; each run starts from an empty
# database. Runs on changes to the live connection or the server, and nightly.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/src/lib/live/**"
      - "apps/web/src/lib/server/**"
      - "apps/web/src/features/auth/**"
      - "apps/web/e2e-live/**"
      - "apps/web/playwright.live.config.ts"
      - ".github/workflows/e2e-live.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/src/lib/live/**"
      - "apps/web/src/lib/server/**"
      - "apps/web/src/features/auth/**"
      - "apps/web/e2e-live/**"
      - "apps/web/playwright.live.config.ts"
      - ".github/workflows/e2e-live.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Start the server (fresh database)
        working-directory: apps/api
        run: |
          cp .env.example .env
          docker compose up -d --wait db redis minio
          timeout 60 sh -c 'until curl -sf http://localhost:9100/minio/health/live; do sleep 1; done'
          uv sync --locked
          uv run alembic upgrade head
          OTP_PER_IP_PER_HOUR=500 uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 60 sh -c 'until curl -sf http://localhost:8000/healthz; do sleep 1; done'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Live E2E
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:live

      - name: Server logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-live-traces
          path: apps/web/test-results
          retention-days: 7
