# Throwaway stack for the live E2E: a fresh, empty Postgres + Redis + the pinned backend image.
# Nothing is published except the API on localhost; the database lives in memory (tmpfs) and is
# gone after `down`. Same file locally and in CI (.github/workflows/e2e-live.yml).
#
#   export BACKEND_IMAGE=$(cat e2e-live/backend.image)        # or a local build, e.g. flexikeys-backend:local
#   export E2E_SECRET_KEY=$(openssl rand -hex 32)
#   docker compose -f e2e-live/compose.yml up -d --wait
#   FK_API_ORIGIN=http://localhost:58000 npm run e2e:live
#   docker compose -f e2e-live/compose.yml down
name: flexikeys-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fk
      POSTGRES_PASSWORD: fk # throwaway, never exposed outside the compose network
      POSTGRES_DB: flexikeys_e2e
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fk -d flexikeys_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Private object storage for parents' photos and voices on My Voice cards.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: e2e-storage
      MINIO_ROOT_PASSWORD: e2e-storage-secret
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches the account emails (verify / reset links); the tests read them via its API on :58025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:${E2E_MAIL_PORT:-58025}:8025"]

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE — see e2e-live/backend.image}
    environment:
      APP_ENV: development # http://localhost: cookies without the Secure flag
      APP_SECRET_KEY: ${E2E_SECRET_KEY:?set E2E_SECRET_KEY, e.g. $(openssl rand -hex 32)}
      DATABASE_URL: postgresql+asyncpg://fk:fk@postgres:5432/flexikeys_e2e
      REDIS_URL: redis://redis:6379/0
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      APP_WEB_URL: http://localhost:3200 # the live E2E web server (playwright.live.config.ts)
      # Every test signs up/logs in from this one machine within a minute; production keeps 20/minute.
      RATE_LIMIT_AUTH: 300/minute
      # Throwaway merchant credentials: the tests play the payment providers' server calls themselves.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: e2e-storage
      STORAGE_SECRET_KEY: e2e-storage-secret
      STORAGE_BUCKET: flexikeys-e2e
      PAYME_MERCHANT_ID: e2e-merchant
      PAYME_KEY: e2e-payme-key
      CLICK_SERVICE_ID: "77"
      CLICK_SECRET_KEY: e2e-click-secret
    ports: ["127.0.0.1:${E2E_API_PORT:-58000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
      minio: { condition: service_healthy }
    healthcheck: # the image's entrypoint runs `alembic upgrade head` first
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
