[project]
name = "flexikeys-api"
version = "0.1.0"
description = "FlexiKeys server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
