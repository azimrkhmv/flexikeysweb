[project]
name = "flexikeys-api"
version = "0.1.0"
description = "FlexiKeys server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    "minio>=7.2.20",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
allowed-confusables = ["ʻ", "ʼ"]  # Uzbek Latin letters (oʻ, gʻ, maʼ)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
